[package]
name = "audio-converter-poc"
version = "0.1.2"
edition = "2021"

[features]
local-installer-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-opener = "2.7.2"
